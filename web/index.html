<!doctype html>
<html lang="en" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KJV Reader</title>
<meta name="description" content="An offline King James Bible reader. The text, Strong's dictionary, Webster's 1828 definitions and cross-references are all bundled — no network, no ads, no analytics.">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101012" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KJV Reader">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<!-- The ?v= stamp is the deploy's identity. GitHub Pages caches files for ten
     minutes and the service worker caches the shell, so without it a fix can sit
     unseen behind two layers of cache. Bump it whenever app.js or style.css
     changes, and bump VERSION in sw.js with it. -->
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<header class="bar">
  <button id="prev" class="bar-btn" type="button" aria-label="Previous chapter">&lsaquo;</button>
  <button id="where" class="where" type="button" aria-haspopup="dialog">
    <span id="bookChapter">Genesis 1</span>
  </button>
  <button id="next" class="bar-btn" type="button" aria-label="Next chapter">&rsaquo;</button>
  <button id="search" class="bar-btn" type="button" aria-label="Search">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path>
    </svg>
  </button>
  <button id="menu" class="bar-btn" type="button" aria-label="Reading settings">&#8943;</button>
</header>

<main id="content" class="page"></main>

<p id="status" class="status" hidden></p>

<script>
  /* When a newly deployed worker takes over, show the new one straight away
     rather than leaving the reader on the previous build until they reload. */
  if ('serviceWorker' in navigator) {
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloaded) return;
      reloaded = true;
      location.reload();
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.getRegistration().then((registration) => {
        if (registration) registration.update().catch(() => {});
      }).catch(() => {});
    });
  }
</script>
<script src="app.js?v=3" defer></script>
</body>
</html>
