<!doctype html>
<html lang="en" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KJV Reader</title>
<meta name="description" content="An offline King James Bible reader. The text, Strong's dictionary, Webster's 1828 definitions and cross-references are all bundled — no network, no ads, no analytics.">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101012" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KJV Reader">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <button id="prev" class="bar-btn" type="button" aria-label="Previous chapter">&lsaquo;</button>
  <button id="where" class="where" type="button" aria-haspopup="dialog">
    <span id="bookChapter">Genesis 1</span>
  </button>
  <button id="next" class="bar-btn" type="button" aria-label="Next chapter">&rsaquo;</button>
  <button id="menu" class="bar-btn" type="button" aria-label="Reading settings">&#8943;</button>
</header>

<main id="content" class="page"></main>

<p id="status" class="status" hidden></p>

<script src="app.js" defer></script>
</body>
</html>
